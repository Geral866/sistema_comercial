{% extends 'base_publica.html' %}
{% block title %}Carrito{% endblock %}
{% block content %}
<div class="text-center py-16">
    <h2 class="font-serif text-3xl font-bold text-primary mb-3">Tu carrito</h2>
    <p class="text-ink-muted mb-6">Estamos cargando tus productos...</p>
    <button onclick="abrirCarrito()" class="bg-primary text-white px-6 py-3 rounded-full font-semibold">Abrir carrito</button>
</div>
{% endblock %}

{% block extra_js %}
<script>document.addEventListener('DOMContentLoaded', abrirCarrito);</script>
{% endblock %}
