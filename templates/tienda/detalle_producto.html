{% extends 'base_publica.html' %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if producto.imagen %}
            <img src="{{ producto.imagen.url }}" class="img-fluid rounded shadow-sm">
        {% else %}
            <div class="bg-light border rounded p-5 text-center text-muted">Sin imagen</div>
        {% endif %}
    </div>
    <div class="col-md-6">
        <h2>{{ producto.nombre }}</h2>
        <p class="text-muted">{{ producto.categoria.nombre }}</p>
        <h3 class="text-success">${{ producto.precio }}</h3>
        <p>{{ producto.descripcion|default:"Sin descripción disponible." }}</p>
        <form method="post" action="{% url 'tienda:agregar_carrito' producto.pk %}">
            {% csrf_token %}
            <div class="mb-3" style="max-width: 150px;">
                <label class="form-label">Cantidad</label>
                <input type="number" name="cantidad" value="1" min="1" class="form-control">
            </div>
            <button type="submit" class="btn btn-success btn-lg">Agregar al carrito 🛒</button>
        </form>
    </div>
</div>
{% endblock %}
