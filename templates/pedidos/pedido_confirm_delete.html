{% extends 'base.html' %}
{% block content %}
<h2>Eliminar pedido</h2>
<p>¿Seguro que deseas eliminar el <strong>Pedido #{{ object.id }}</strong> de {{ object.cliente.nombre }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'pedidos:lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
