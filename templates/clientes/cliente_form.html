{% extends 'base.html' %}
{% block title %}Cliente{% endblock %}
{% block content %}
<h2>{% if object %}Editar{% else %}Nuevo{% endif %} cliente</h2>
<form method="post" class="bg-white p-4 rounded shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'clientes:lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
